<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UNION-CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#f4f7f8; --grid:#dbe4e6; --grid-strong:#b7c6c9; --header-fill:#e3f6f5;
    --accent:#0fb4ae; --accent-dark:#0b8f8a; --accent2:#2d6ae3;
    --warn:#b3261e; --warn-bg:#fdecea;
    --ink:#1f2b2b; --ink-soft:#5c7273; --card:#ffffff; --radius:6px;
  }
  *{box-sizing:border-box;} body{margin:0;}
  .app{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif; color:var(--ink); background:var(--bg); min-height:100vh; font-size:13px;}
  .num{font-family:Consolas,'SF Mono',monospace; font-variant-numeric:tabular-nums;}
  h1,h2,h3{margin:0; font-weight:600;}

  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(160deg,#eaf7f6 0%,#f4f7f8 55%,#eef2f0 100%);}
  .login-card{background:#fff; width:380px; padding:44px 36px; border-radius:14px; box-shadow:0 20px 45px rgba(15,180,174,.14), 0 2px 8px rgba(0,0,0,.04); text-align:center;}
  .login-card .logo{font-size:26px; font-weight:800; letter-spacing:1px; color:var(--ink); margin-bottom:22px; font-style:italic;}
  .login-card h1{font-size:17px; font-weight:700;}
  .login-card h1 .accent-word{color:var(--accent);}
  .login-card p.sub{color:var(--ink-soft); font-size:12px; margin:6px 0 24px;}
  .login-card input{width:100%; padding:12px 14px; font-size:14px; border:1px solid transparent; background:#eef4f5; margin-bottom:12px; border-radius:8px; font-family:inherit;}
  .login-card input:focus{outline:none; border-color:var(--accent); background:#fff;}
  .btn-primary{background:var(--accent); color:#fff; border:none; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; width:100%; border-radius:var(--radius);}
  .btn-primary:hover{background:var(--accent-dark);}
  .login-note{font-size:11px; color:#8a8f98; margin-top:16px; line-height:1.5;}

  .shell{display:flex; min-height:100vh;}
  .sidebar{width:200px; background:#1b2733; color:#cfd6dd; flex-shrink:0; display:flex; flex-direction:column; padding:20px 0;}
  .brand{padding:0 18px 16px; border-bottom:1px solid #2e3c4a; margin-bottom:6px;}
  .brand h2{font-size:16px; color:#fff;}
  .brand .who{font-size:11px; color:#8b95a1; margin-top:5px;}
  .nav-item{padding:10px 18px; cursor:pointer; font-size:13px; border-left:3px solid transparent;}
  .nav-item:hover{background:#243342;}
  .nav-item.active{background:#243342; color:#fff; border-left:3px solid var(--accent);}
  .nav-item.sub{padding-left:32px; font-size:12.5px;}
  .nav-group-label{padding:14px 18px 4px; font-size:10.5px; color:#7c8894; text-transform:uppercase; letter-spacing:.6px; margin-top:4px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none;}
  .nav-group-label:hover{color:#cfd6dd;}
  .nav-group-arrow{font-size:9px; transition:transform .15s;}
  .nav-footer{margin-top:auto; padding:14px 18px 0; border-top:1px solid #2e3c4a;}
  .logout-link{color:#8b95a1; font-size:11px; cursor:pointer;}
  .logout-link:hover{color:#fff;}

  .main{flex:1; padding:26px 34px; overflow-x:auto;}
  .page-title{font-size:19px; margin-bottom:3px; font-weight:700;}
  .page-sub{color:var(--ink-soft); font-size:12px; margin-bottom:20px;}

  .card{background:var(--card); border:1px solid var(--grid); border-radius:var(--radius); padding:20px; margin-bottom:18px;}
  .card h3{font-size:13px; margin-bottom:14px; text-transform:uppercase; letter-spacing:.4px; color:var(--accent-dark);}

  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  .field label{display:block; font-size:11px; color:var(--ink-soft); margin-bottom:4px;}
  .field select, .field input, .field textarea{width:100%; padding:7px 9px; border:1px solid var(--grid-strong); font-size:13px; border-radius:var(--radius); font-family:inherit; background:#fff;}
  .field{margin-bottom:12px;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; padding:7px 6px; background:var(--header-fill); border:1px solid var(--grid); font-weight:700; color:var(--accent-dark); font-size:11.5px; white-space:nowrap;}
  td{padding:6px; border:1px solid var(--grid); vertical-align:middle;}
  tr:hover td{background:#dcf3f1;}

  .btn-sm{background:#fff; border:1.5px solid var(--accent); color:var(--accent-dark); font-weight:700; padding:6px 12px; cursor:pointer; font-size:12px; border-radius:var(--radius); transition:background .15s,color .15s;}
  .btn-sm:hover{background:var(--accent); color:#fff;}
  .btn-danger{color:#b3261e; background:#fff; border:1.5px solid #b3261e; font-weight:700;}
  .icon-btn{width:24px; height:24px; display:inline-flex; align-items:center; justify-content:center; border-radius:4px; border:1.5px solid var(--accent); background:#fff; color:var(--accent-dark); cursor:pointer; font-size:12px; padding:0; line-height:1; vertical-align:middle;}
  .icon-btn:hover{background:var(--accent); color:#fff;}
  .icon-btn.danger{border-color:#b3261e; color:#b3261e; font-weight:800; font-size:15px;}
  .icon-btn.danger:hover{background:#b3261e; color:#fff;}
  .icon-btn.copy{border-color:var(--accent2); color:var(--accent2);}
  .icon-btn.copy:hover{background:var(--accent2); color:#fff;}
  .omField{width:100%; padding:5px 7px; border:1px solid var(--grid-strong); border-radius:2px; font-family:inherit; font-size:12.5px; background:#fff; box-sizing:border-box;}
  .omField:focus{border-color:var(--accent); outline:none;}
  .btn-danger:hover{background:#b3261e; color:#fff;}
  .btn-ghost{background:#fff; border:1.5px solid var(--accent-dark); color:var(--accent-dark); font-weight:700;}
  .btn-ghost:hover{background:var(--accent-dark); color:#fff;}

  .toolbar{display:flex; gap:10px; margin-bottom:14px; align-items:center; flex-wrap:wrap;}
  .toolbar input, .toolbar select{padding:7px 9px; border:1px solid var(--grid-strong); border-radius:var(--radius); font-family:inherit; font-size:12.5px;}

  .tabs{display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap;}
  .tab-btn{padding:8px 16px; background:#fff; border:1px solid var(--grid); border-bottom:none; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-soft); border-radius:var(--radius) var(--radius) 0 0;}
  .tab-btn .cnt{color:var(--accent-dark); font-family:Consolas,monospace;}
  .tab-btn.active{background:var(--header-fill); color:var(--accent-dark); border-color:var(--grid-strong);}

  .badge{display:inline-block; padding:2px 8px; border-radius:10px; font-size:10.5px; font-weight:700;}
  .badge.blue{background:#e8edfb; color:var(--accent2);}
  .badge.green{background:#e7f3ec; color:var(--accent-dark);}
  .badge.gray{background:#eef1f3; color:var(--ink-soft);}
  .badge.warn{background:var(--warn-bg); color:var(--warn);}
  .badge.gold{background:#fff3d6; color:#8a6d1f;}

  .empty{text-align:center; padding:36px 20px; color:var(--ink-soft); font-size:12.5px;}
  .stat-row{display:flex; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
  .stat-box{flex:1; min-width:150px; background:var(--card); border:1px solid var(--grid); padding:16px 18px; border-radius:var(--radius); border-top:3px solid var(--accent);}
  .stat-box.blue{border-top-color:var(--accent2);}
  .stat-box .num{font-family:Consolas,monospace; font-size:22px; font-weight:700;}
  .stat-box .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}

  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px;}
  .bar-label{width:110px; flex-shrink:0; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-track{flex:1; background:var(--header-fill); height:16px; border-radius:2px;}
  .bar-fill{background:var(--accent); height:100%; border-radius:2px;}
  .bar-fill.blue{background:var(--accent2);}
  .bar-fill.orange{background:#f5941f;}
  .bar-val{width:150px; text-align:right; font-weight:600; flex-shrink:0; font-family:Consolas,monospace;}

  .modal-bg{position:fixed; inset:0; background:rgba(20,25,30,.55); display:flex; align-items:flex-start; justify-content:center; z-index:200; overflow-y:auto; padding:30px 0;}
  .modal{background:#fff; width:680px; max-width:94vw; padding:0; border-radius:var(--radius); position:relative;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid var(--grid); background:var(--header-fill);}
  .modal-close{cursor:pointer; font-size:18px; color:var(--ink-soft); background:none; border:none;}
  .modal-body{padding:24px; max-height:78vh; overflow-y:auto;}
  .modal-actions{padding:14px 20px; border-top:1px solid var(--grid); display:flex; justify-content:flex-end; gap:8px;}

  .pick-row{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--grid); border-radius:var(--radius); margin-bottom:8px;}
  .pick-row .info{font-size:12.5px;}
  .pick-row .info .name{font-weight:700; margin-bottom:2px;}
  .pick-row .info .sub{color:var(--ink-soft); font-size:11.5px;}

  .alert-box{border:1px solid var(--warn); background:var(--warn-bg); border-radius:var(--radius); padding:14px 16px; margin-bottom:18px;}
  .alert-box h4{margin:0 0 8px; font-size:12.5px; color:var(--warn);}
  .alert-item{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0; border-bottom:1px dashed #e6b3ae;}
  .alert-item:last-child{border-bottom:none;}

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:#1b2733; color:#fff; padding:11px 20px; border-radius:var(--radius); font-size:13px; z-index:500; box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .hint{font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}
  .excel-fab{position:fixed; bottom:18px; right:18px; width:30px; height:30px; border-radius:50%; background:#1d6f42; color:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 3px 8px rgba(0,0,0,.28); font-size:9px; font-weight:800; z-index:150; letter-spacing:-0.5px;}
  .excel-fab:hover{background:#155a35; transform:scale(1.06);}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  const SUPABASE_URL = 'https://wqqwpqurxfomyolvresd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_10_lrFOl0rxxagkvY7q8bA_9Ht86O-o';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const root = document.getElementById('app');
  const STAGES_OPP = ['리드생성','기회인지','니즈확인','제안','협상','수주완료','수주실패'];
  const STAGES_CTR = ['계약','납품완료','청구완료','수금완료','유지보수'];
  const REQUEST_TYPES = ['없음','계산서 요청','완료'];
  const BILLING_CYCLES = ['연납','분기납','월납'];
  const OPP_TYPES = ['신규','갱신'];
  const OPP_SOURCES = ['아웃바운드','인바운드','파트너영업','기존고객확장'];
  const RENEWAL_TYPES = ['자동갱신','수동갱신','종료예정'];
  const BIZ_TYPES = ['엔코아','마이크로소프트','오토데스크','하드웨어','기타'];
  const PRODUCT_VENDORS = ['엔코아','EST','Autodesk','Adobe','MS','기타'];
  const CUST_TYPES = ['신규','갱신'];
  const SOURCES_NEW = ['직접영업','홈페이지','온라인문의','기타'];
  const SOURCES_RENEWAL = ['갱신'];
  function sourceOptsFor(type){ return type==='갱신'? SOURCES_RENEWAL : SOURCES_NEW; }
  function oppSourceOptsFor(type){ return type==='갱신' ? ['갱신'] : OPP_SOURCES; }
  const PERIOD_TYPES = [['month','월별'],['quarter','분기별'],['half','반기별'],['year','년별']];
  const NAV = [
    {kind:'item', key:'dashboard', label:'대시보드'},
    {kind:'group', label:'영업관리', children:[['opportunities','영업기회관리'],['contracts','계약관리'],['maintenance','유지보수관리']]},
    {kind:'group', label:'등록', children:[['customers','고객정보'],['products','품목관리'],['reps','담당자관리']]},
    {kind:'item', key:'stats', label:'통합분석'},
  ];

  let state = {
    view:'login', user:null, userEmail:null, isAdmin:false, tab:'dashboard', loading:true,
    customers:[], opportunities:[], contracts:[], products:[], reps:[], maintenance:[],
    oppStage:'전체', ctrStage:'전체', filterText:'',
    statsPeriod:'month', statsPeriodValue:'전체', statsRepFilter:'', statsBizFilter:'',
    custAddOpen:false, prodAddOpen:false, repAddOpen:false,
    navOpenGroups:{'영업관리':true, '등록':true},
    custFilterRep:'전체',
    oppFilterVendor:'전체', oppFilterRep:'전체',
    ctrFilterBiz:'전체', ctrFilterRep:'전체', ctrFilterRequest:'전체',
    mtFilterRep:'전체', mtFilterCycle:'전체', mtFilterRenewal:'전체',
    oppExpandedId:null, ctrExpandedId:null, mtExpandedId:null,
    dashboardPeriodType:'year', dashboardPeriodValue:null,
    modal:null, oppModal:null, confirmModal:null, oppPickerOpen:false, mtPickerOpen:false, toast:null,
    ctrSelected:new Set(), mergePickerOpen:false,
    sortState:{},
  };

  function showToast(m){ state.toast=m; render(); clearTimeout(showToast._t); showToast._t=setTimeout(()=>{state.toast=null; render();},2200); }
  function askConfirm(message,onYes,confirmLabel,danger){ state.confirmModal={message,onYes,confirmLabel:confirmLabel||'삭제',danger:danger!==false}; render(); }
  function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function addDays(dateStr, n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function won(n){ return '₩'+Math.round(Number(n||0)).toLocaleString('ko-KR'); }
  function daysAgo(dateStr, days){ if(!dateStr) return false; const d=new Date(dateStr), now=new Date(); return (now-d)/86400000 <= days; }
  function daysUntil(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'), now=new Date(todayStr()+'T00:00:00'); return Math.round((d-now)/86400000); }
  function nextCode(prefix, list){
    const compact = todayStr().replace(/-/g,'');
    const n = list.filter(x=>x.code && x.code.startsWith(prefix+compact)).length+1;
    return prefix+compact+'-'+String(n).padStart(3,'0');
  }
  function periodKey(dateStr, type){
    if(!dateStr) return '(미지정)';
    const parts = dateStr.split('-'); const y=Number(parts[0]), m=Number(parts[1]);
    if(type==='quarter') return y+'-Q'+Math.ceil(m/3);
    if(type==='half') return y+'-H'+(m<=6?1:2);
    if(type==='year') return String(y);
    return y+'-'+String(m).padStart(2,'0');
  }
  function buildRepOpts(current){
    const set = new Set(state.reps.map(r=>r.name).filter(Boolean));
    if(current) set.add(current);
    if(set.size===0) set.add(state.user);
    return [...set].sort((a,b)=>a.localeCompare(b,'ko'));
  }
  function sortedCustomers(){ return [...state.customers].sort((a,b)=>a.name.localeCompare(b.name,'ko')); }
  function sortedProducts(){ return [...state.products].sort((a,b)=>a.name.localeCompare(b.name,'ko')); }
  function sortedContracts(){ return [...state.contracts].sort((a,b)=>a.name.localeCompare(b.name,'ko')); }
  function contractName(id){ const c=state.contracts.find(x=>x.id===id); return c?c.name:'(미지정)'; }
  function contractCustomerName(id){ const c=state.contracts.find(x=>x.id===id); return c?custName(c.customerId):'-'; }
  function contractCode(id){ const c=state.contracts.find(x=>x.id===id); return c?c.code:'-'; }
  function contractVendor(id){ const c=state.contracts.find(x=>x.id===id); return c?c.bizType:'-'; }
  function contractVendorList(c){
    const opp = c.opportunityId ? state.opportunities.find(o=>o.id===c.opportunityId) : null;
    if(opp && opp.items && opp.items.length) return oppVendors(opp);
    return String(c.bizType||'').split(',').map(s=>s.trim()).filter(Boolean);
  }
  function expiringContracts(){
    return state.contracts.filter(c=>{
      if(!c.expiryDate) return false;
      const d = daysUntil(c.expiryDate);
      return d!==null && d>=0 && d<=Number(c.alertDays||0);
    }).sort((a,b)=>daysUntil(a.expiryDate)-daysUntil(b.expiryDate));
  }
  function expiringMaintenance(){
    return state.maintenance.filter(m=>{
      if(!m.endDate) return false;
      const d = daysUntil(m.endDate);
      return d!==null && d>=0 && d<=Number(m.alertDays||0);
    }).sort((a,b)=>daysUntil(a.endDate)-daysUntil(b.endDate));
  }
  function itemVendor(it){ if(it.vendor) return it.vendor; const p=state.products.find(x=>x.id===it.productId); return p?p.vendor:''; }
  function oppVendors(o){ const set=new Set(); (o.items||[]).forEach(it=>{ const v=itemVendor(it); if(v) set.add(v); }); return [...set]; }
  function itemProductName(it){ if(it.productId){ const p=state.products.find(x=>x.id===it.productId); return p?p.name:''; } return it.customDetail||''; }
  function oppProductNames(o){ const set=new Set(); (o.items||[]).forEach(it=>{ const n=itemProductName(it); if(n) set.add(n); }); return [...set]; }
  function allProductNames(){ const set=new Set(); state.products.forEach(p=>{ if(p.name) set.add(p.name); }); state.opportunities.forEach(o=>(o.items||[]).forEach(it=>{ const n=itemProductName(it); if(n) set.add(n); })); return [...set].sort((a,b)=>a.localeCompare(b,'ko')); }
  function allVendorNames(){ const set=new Set(); state.products.forEach(p=>{ if(p.vendor) set.add(p.vendor); }); state.opportunities.forEach(o=>(o.items||[]).forEach(it=>{ const v=itemVendor(it); if(v) set.add(v); })); return [...set].sort((a,b)=>a.localeCompare(b,'ko')); }
  function custName(id){ const c=state.customers.find(x=>x.id===id); return c?c.name:'(미지정)'; }
  function compareValues(a,b){
    const an = Number(a), bn = Number(b);
    if(a!=='' && b!=='' && a!=null && b!=null && !isNaN(an) && !isNaN(bn)) return an-bn;
    return String(a||'').localeCompare(String(b||''),'ko');
  }
  function applySortState(list, tableKey, getters){
    const st = state.sortState[tableKey];
    if(!st || !st.key || !getters[st.key]) return list;
    const getter = getters[st.key];
    const sorted = [...list].sort((a,b)=>{
      const cmp = compareValues(getter(a), getter(b));
      return st.dir==='asc' ? cmp : -cmp;
    });
    return sorted;
  }
  function sortTh(label, tableKey, colKey, extraStyle){
    const st = state.sortState[tableKey] || {};
    const active = st.key===colKey;
    const arrow = active ? (st.dir==='asc'?'▲':'▼') : '▵';
    return `<th style="${extraStyle||''}"><span class="sort-th" data-table="${tableKey}" data-col="${colKey}" style="cursor:pointer; user-select:none; display:flex; align-items:center; justify-content:space-between; gap:4px;">${label}<span style="font-size:8px; color:${active?'var(--accent-dark)':'#c3ccce'};">${arrow}</span></span></th>`;
  }
  function bindFilterInput(id){
    const el = document.getElementById(id); if(!el) return;
    let composing=false, timer=null;
    const scheduleRender = ()=>{ clearTimeout(timer); timer=setTimeout(()=>{ if(!composing) render(); }, 220); };
    el.addEventListener('compositionstart', ()=>{ composing=true; clearTimeout(timer); });
    el.addEventListener('compositionend', ()=>{ composing=false; state.filterText=el.value; scheduleRender(); });
    el.addEventListener('input', ()=>{ state.filterText=el.value; if(!composing) scheduleRender(); });
  }
  function exportCurrentPage(){
    let rows = [], filename = 'export.xlsx', itemRows = null, itemSheetName = '품목상세';
    if(state.tab==='customers'){
      rows = state.customers.map(c=>({'고객사코드':c.code,'고객사명':c.name,'사업자등록번호':c.bizRegNo,'고객담당자':c.contactName,'담당이메일':c.contactEmail,'담당전화번호':c.contactPhone,'산업군':c.industry,'영업담당':c.salesRep,'등록일':c.regDate}));
      filename='고객정보.xlsx';
    } else if(state.tab==='products'){

  function calcOppItemsTotal(items){ return (items||[]).reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0); }

  function bindRemarksLogField(d, key, logEl, inputEl){
    function splitEntries(){ return (d[key]||'').split('\n\n').filter(l=>l.trim()); }
    function refresh(){
      const lines = splitEntries();
      if(lines.length===0){
        logEl.innerHTML = '<span style="color:#b9c1c9;">등록된 비고가 없습니다.</span>';
      } else {
        logEl.innerHTML = lines.map((line,i)=>`<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:6px; padding:3px 0; border-bottom:1px dashed var(--grid);"><span style="flex:1; white-space:pre-wrap;">${esc(line)}</span><button type="button" class="remarks-del-btn" data-idx="${i}" title="삭제" style="border:none; background:none; color:#b3261e; cursor:pointer; font-size:13px; font-weight:800; line-height:1; flex-shrink:0; padding:0 2px;">&times;</button></div>`).join('');
        logEl.querySelectorAll('.remarks-del-btn').forEach(btn=>{
          btn.onclick=()=>{
            const idx = Number(btn.dataset.idx);
            const arr = splitEntries();
            arr.splice(idx,1);
            d[key] = arr.join('\n\n');
            refresh();
          };
        });
      }
    }
    refresh();
    function autoGrow(){ inputEl.rows = Math.min(6, Math.max(1, inputEl.value.split('\n').length)); }
    inputEl.addEventListener('input', autoGrow);
    inputEl.addEventListener('keydown', e=>{
      if(e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        const text = inputEl.value.trim();
        if(!text) return;
        const line = `[${todayStr()}] ${text}`;
        d[key] = d[key] ? line+'\n\n'+d[key] : line;
        inputEl.value='';
        inputEl.rows = 1;
        refresh();
      }
    });
  }

  async function loadAll(){
    state.loading=true; render();
    const [cu, op, cr, pr, rp, mt] = await Promise.all([
      sb.from('customers').select('*').order('created_at',{ascending:false}),
      sb.from('opportunities').select('*').order('created_at',{ascending:false}),
      sb.from('contracts').select('*').order('created_at',{ascending:false}),
      sb.from('products').select('*').order('created_at',{ascending:false}),
      sb.from('reps').select('*').order('created_at',{ascending:false}),
      sb.from('maintenance_contracts').select('*').order('created_at',{ascending:false}),
    ]);
    state.customers = (cu.data||[]).map(custFromRow);
    state.opportunities = (op.data||[]).map(oppFromRow);
    state.contracts = (cr.data||[]).map(ctrFromRow);
    state.products = pr.data||[];
    state.reps = rp.data||[];
    state.maintenance = (mt.data||[]).map(mtFromRow);
    const myRep = state.reps.find(r=>r.email && state.userEmail && r.email.toLowerCase()===state.userEmail.toLowerCase());
    state.isAdmin = !!(myRep && myRep.is_admin);
    if(myRep && myRep.name) state.user = myRep.name;
    state.loading=false; render();
  }

  function render(){
    const active = document.activeElement;
    let restoreId=null, selStart=null, selEnd=null;
    if(active && active.id && (active.tagName==='INPUT' || active.tagName==='TEXTAREA')){
      restoreId = active.id;
      try{ selStart=active.selectionStart; selEnd=active.selectionEnd; }catch(e){}
    }
    if(state.view==='login'){ root.innerHTML=renderLogin(); bindLogin(); return; }
    root.innerHTML=renderShell();
    bindShell();
    if(restoreId){
      const el = document.getElementById(restoreId);
      if(el && el.focus){
        el.focus();
        if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
      }
    }
  }

  function bindLogin(){
    let mode='login';
    const btn=document.getElementById('loginBtn'), emailEl=document.getElementById('loginEmail'), pwEl=document.getElementById('loginPassword'), nameEl=document.getElementById('loginName');
    const nameWrap=document.getElementById('signupNameWrap'), sub=document.getElementById('loginSub'), toggle=document.getElementById('toggleSignup'), errEl=document.getElementById('loginError');
    toggle.onclick=(e)=>{
      e.preventDefault();
      mode = mode==='login'?'signup':'login';
      nameWrap.style.display = mode==='signup'?'block':'none';
      sub.textContent = mode==='signup'?'이메일, 비밀번호, 이름을 입력해 가입하세요':'이메일과 비밀번호로 로그인하세요';
      btn.textContent = mode==='signup'?'가입하기':'로그인';
      toggle.textContent = mode==='signup'?'로그인으로 돌아가기':'회원가입';
      errEl.textContent='';
    };
    async function go(){
      const email=emailEl.value.trim(), password=pwEl.value;
      if(!email || !password){ errEl.textContent='이메일과 비밀번호를 입력하세요.'; return; }
      btn.disabled=true;
      if(mode==='signup'){
        const name=(nameEl.value||'').trim();
        const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ name: name||email } } });
        btn.disabled=false;
        if(error){ errEl.textContent=error.message; return; }
        if(!data.session){ errEl.textContent='가입 완료. 관리자가 이메일 인증을 켜둔 경우 인증 후 로그인해주세요.'; return; }
        state.user = name||email; state.userEmail = email; state.view='main'; loadAll();
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        btn.disabled=false;
        if(error){ errEl.textContent='로그인 실패: '+error.message; return; }
        const u = data.user;
        state.user = (u.user_metadata && u.user_metadata.name) || u.email;
        state.userEmail = u.email;
        state.view='main'; loadAll();
      }
    }
    btn.onclick=go;
    pwEl.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    emailEl.focus();
  }

  function contractOppType(c){ const opp = c.opportunityId ? state.opportunities.find(o=>o.id===c.opportunityId) : null; return opp ? opp.oppType : null; }
  function statRow(typeVal, periodType, periodValue){
    const oppRecent = state.opportunities.filter(o=>o.regDate && periodKey(o.regDate,periodType)===periodValue && o.oppType===typeVal);
    const ctrRecent = state.contracts.filter(c=>c.regDate && periodKey(c.regDate,periodType)===periodValue && contractOppType(c)===typeVal);
    const ctrAmount = ctrRecent.reduce((s,c)=>s+Number(c.amount||0),0);
    return { oppRecent:oppRecent.length, ctrRecent:ctrRecent.length, ctrAmount };
  }
  function dashboardAvailablePeriods(periodType){
    const set = new Set([periodKey(todayStr(), periodType)]);
    state.opportunities.forEach(o=>{ if(o.regDate) set.add(periodKey(o.regDate, periodType)); });
    state.contracts.forEach(c=>{ if(c.regDate) set.add(periodKey(c.regDate, periodType)); });
    return [...set].sort((a,b)=>b.localeCompare(a));
  }

    const add=document.getElementById('addCustBtn'); if(add) add.onclick=async ()=>{
      const name=document.getElementById('cName').value.trim(); if(!name) return alert('거래처명을 입력하세요.');
      const c = {id:'cu_'+Date.now(), code:nextCode('CT',state.customers), name,
        bizRegNo:document.getElementById('cBizRegNo').value.trim(),
        contactName:document.getElementById('cContactName').value.trim(), contactEmail:document.getElementById('cContactEmail').value.trim(), contactPhone:document.getElementById('cContactPhone').value.trim(),
        industry:document.getElementById('cIndustry').value.trim(),
        salesRep:document.getElementById('cSalesRep').value, regDate:todayStr()};
      const { error } = await sb.from('customers').insert(custToRow(c));
      if(error){ alert('저장 실패: '+error.message); return; }
      state.customers.unshift(c);
      showToast('거래처가 추가되었습니다.'); render();
    };
    document.querySelectorAll('.editCustBtn').forEach(b=>b.onclick=()=>openCustomerModal(state.customers.find(c=>c.id===b.dataset.id)));
    document.querySelectorAll('.delCustBtn').forEach(b=>b.onclick=()=>askConfirm('이 고객사를 삭제할까요?', async ()=>{
      const { error } = await sb.from('customers').delete().eq('id', b.dataset.id);
      if(error){ alert('삭제 실패: '+error.message); return; }
      state.customers=state.customers.filter(c=>c.id!==b.dataset.id); render();
    }));

    const excelBtn=document.getElementById('custExcelBtn'), excelInput=document.getElementById('custExcelInput');
    if(excelBtn) excelBtn.onclick=()=>excelInput.click();
    if(excelInput) excelInput.onchange=(e)=>{
      const file=e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data,{type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
          const newCusts = [];
          rows.forEach((r,idx)=>{
            const name = String(r['고객사명']||r['거래처명']||'').trim();
            if(!name) return;
            newCusts.push({id:'cu_'+Date.now()+'_'+idx, code:nextCode('CT',[...state.customers,...newCusts]), name,
              bizRegNo:String(r['사업자등록번호']||'').trim(),
              contactName:String(r['고객담당자']||r['대표자']||'').trim(), contactEmail:String(r['고객담당이메일']||'').trim(), contactPhone:String(r['고객담당전화번호']||'').trim(),
              industry:String(r['산업군']||'').trim(),
              salesRep:String(r['영업담당']||state.user).trim(), regDate:todayStr()});
          });
          if(newCusts.length===0){ alert('등록할 데이터를 찾지 못했습니다. 헤더(고객사명 등)를 확인해주세요.'); return; }
          const { error } = await sb.from('customers').insert(newCusts.map(custToRow));
          if(error){ alert('일괄등록 실패: '+error.message); return; }
          state.customers.unshift(...newCusts);
          showToast(newCusts.length+'건 일괄등록되었습니다.'); render();
        }catch(err){ alert('엑셀 파일을 읽는 중 오류가 발생했습니다.'); }
        finally{ excelInput.value=''; }
      };
      reader.readAsArrayBuffer(file);
    };
  }

            </div></td></tr>`;
          }
          return rows;
        }).join('')}

  function bindOppModal(){

    if(cancel) cancel.onclick=closeFn;

    const custSearchEl=document.getElementById('omCustomerSearch'), custSuggEl=document.getElementById('omCustomerSuggestions');

      function showCustSuggestions(query){
        const q = query.trim();
        if(!q){ custSuggEl.style.display='none'; custSuggEl.innerHTML=''; return; }
        const matches = sortedCustomers().filter(c=>c.name.includes(q)).slice(0,8);
        if(matches.length===0){
          custSuggEl.innerHTML = `<div style="padding:8px 10px; color:var(--ink-soft); font-size:12.5px;">일치하는 고객사가 없습니다</div>`;
        } else {
          custSuggEl.innerHTML = matches.map(c=>`<div class="cust-sugg-item" data-id="${c.id}" style="padding:8px 10px; cursor:pointer; font-size:12.5px; border-bottom:1px solid var(--grid);">${esc(c.name)}</div>`).join('');
          custSuggEl.querySelectorAll('.cust-sugg-item').forEach(item=>{
            item.addEventListener('mousedown', e=>{
              e.preventDefault();
              d.customerId = item.dataset.id;
              custSearchEl.value = custName(d.customerId);
              custSuggEl.style.display='none';
            });
            item.addEventListener('mouseenter', ()=>{ item.style.background='var(--header-fill)'; });
            item.addEventListener('mouseleave', ()=>{ item.style.background='#fff'; });
          });
        }
        custSuggEl.style.display='block';
      }
      custSearchEl.addEventListener('input', e=>{ d.customerId=''; showCustSuggestions(e.target.value); });
      custSearchEl.addEventListener('focus', e=>{ if(e.target.value.trim()) showCustSuggestions(e.target.value); });
      custSearchEl.addEventListener('blur', ()=>{ setTimeout(()=>{ custSuggEl.style.display='none'; }, 150); });
    }

      d.oppType=e.target.value;

        const opts = oppSourceOptsFor(d.oppType);
        sourceSel.innerHTML = opts.map(s=>`<option>${s}</option>`).join('');
        d.oppSource = sourceSel.value;
      }
    };
    const sourceEl=document.getElementById('omSource'); if(sourceEl) sourceEl.onchange=e=>d.oppSource=e.target.value;
    const dateEl=document.getElementById('omDate'); if(dateEl) dateEl.onchange=e=>d.expectedDate=e.target.value;
    const repEl=document.getElementById('omRep'); if(repEl) repEl.onchange=e=>d.salesRep=e.target.value;

    function updateRowAndTotal(i){
      const row = document.querySelector(`#omItemsBody tr[data-i="${i}"]`);
      if(row){
        const amt = (Number(d.items[i].qty)||0)*(Number(d.items[i].price)||0);
        const amtCell = row.querySelector('.omItemAmount');
        if(amtCell) amtCell.textContent = won(amt);
      }
      const totalEl = document.getElementById('omTotalDisplay');
      if(totalEl) totalEl.textContent = won(calcOppItemsTotal(d.items));
      const profitTotalEl = document.getElementById('omProfitTotalDisplay');
      if(profitTotalEl) profitTotalEl.textContent = won(calcOppItemsProfitTotal(d.items));
    }
    function bindDetailCell(row, i){
      const it = d.items[i];
      const prodSel = row.querySelector('.omItemProductSel');
      if(prodSel) prodSel.onchange=e=>{
        it.productId = e.target.value;
        if(it.productId){
          const p = state.products.find(x=>x.id===it.productId);
          if(p){ it.price = p.price; if(!it.qty) it.qty = 1; }
          it.customDetail='';
        }
        const detailTd = row.querySelector('.omItemDetailCell');
        if(detailTd){ detailTd.innerHTML = oppDetailCellHTML(it); bindDetailCell(row,i); }
        const qtyEl = row.querySelector('.omItemQty'), priceEl = row.querySelector('.omItemPrice');
        if(qtyEl) qtyEl.value = it.qty;
        if(priceEl) priceEl.value = it.price;
        updateRowAndTotal(i);
      };
      const customInput = row.querySelector('.omItemCustomDetail');
      if(customInput) customInput.oninput=e=>{ it.customDetail = e.target.value; };
    }
    document.querySelectorAll('#omItemsBody tr').forEach(row=>{
      const i = Number(row.dataset.i);
      const vendorEl = row.querySelector('.omItemVendor');
      if(vendorEl){
        vendorEl.addEventListener('focus', function(){ this.dataset.prevVal = this.value; this.value=''; });
        vendorEl.addEventListener('blur', function(){ if(this.value.trim()===''){ this.value = this.dataset.prevVal||''; } });
        vendorEl.addEventListener('change', e=>{
          d.items[i].vendor = e.target.value.trim();
          d.items[i].productId=''; d.items[i].customDetail=''; d.items[i].price=0;
          const detailTd = row.querySelector('.omItemDetailCell');
          if(detailTd){ detailTd.innerHTML = oppDetailCellHTML(d.items[i]); bindDetailCell(row,i); }
          const priceEl = row.querySelector('.omItemPrice'); if(priceEl) priceEl.value = 0;
          updateRowAndTotal(i);
        });
      }
      bindDetailCell(row, i);
      const qtyEl = row.querySelector('.omItemQty');
      if(qtyEl) qtyEl.oninput=e=>{ d.items[i].qty = e.target.value; updateRowAndTotal(i); };
      const priceEl = row.querySelector('.omItemPrice');
      if(priceEl) priceEl.oninput=e=>{ d.items[i].price = e.target.value; updateRowAndTotal(i); };
      const profitEl = row.querySelector('.omItemProfit');
      if(profitEl) profitEl.oninput=e=>{ d.items[i].profit = e.target.value; updateRowAndTotal(i); };
      const delBtn = row.querySelector('.omItemDel');
      if(delBtn) delBtn.onclick=()=>{ d.items.splice(i,1); render(); };
    });
    const addItemBtn=document.getElementById('omAddItemBtn'); if(addItemBtn) addItemBtn.onclick=()=>{ d.items.push({vendor:'',productId:'',customDetail:'',qty:1,price:0,profit:0}); render(); };

    if(save) save.onclick=async ()=>{
      if(!String(d.name||'').trim()){ alert('영업기회명을 입력하세요.'); return; }
      d.expectedAmount = calcOppItemsTotal(d.items);
      const row = oppToRow(d);
      if(m.isNew){
        const { error } = await sb.from('opportunities').insert(row);
        if(error){ alert('저장 실패: '+error.message); return; }
        state.opportunities.unshift(d);
      } else {
        const { error } = await sb.from('opportunities').update(row).eq('id', d.id);
        if(error){ alert('저장 실패: '+error.message); return; }
        const i=state.opportunities.findIndex(x=>x.id===d.id); if(i>-1) state.opportunities[i]=d;
      }
      state.oppModal=null;
      showToast('저장되었습니다.');
    };
  }

  function bindContracts(){
    document.querySelectorAll('[data-stage]').forEach(el=>el.onclick=()=>{ state.ctrStage=el.dataset.stage; render(); });
    bindFilterInput('ctrFilter');
    const bizSel=document.getElementById('ctrBizFilterSel'); if(bizSel) bizSel.onchange=e=>{ state.ctrFilterBiz=e.target.value; render(); };
    const repSel=document.getElementById('ctrRepFilterSel'); if(repSel) repSel.onchange=e=>{ state.ctrFilterRep=e.target.value; render(); };
    const reqSel=document.getElementById('ctrReqFilterSel'); if(reqSel) reqSel.onchange=e=>{ state.ctrFilterRequest=e.target.value; render(); };
    const add=document.getElementById('addCtrBtn'); if(add) add.onclick=()=>{ state.oppPickerOpen=true; render(); };
    const excelBtn=document.getElementById('ctrExcelBtn'), excelInput=document.getElementById('ctrExcelInput');
    if(excelBtn) excelBtn.onclick=()=>excelInput.click();
    if(excelInput) excelInput.onchange=(e)=>{
      const file=e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async (ev)=>{
        try{
          const data = new Uint8Array(ev.target.result);
          const wb = XLSX.read(data,{type:'array'});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
          const newCtrs = []; let skipped = 0;
          rows.forEach((r,idx)=>{
            const name = String(r['계약명']||'').trim();
            const custNameStr = String(r['고객사명']||'').trim();
            if(!name || !custNameStr) return;
            const cust = state.customers.find(c=>c.name===custNameStr);
            if(!cust){ skipped++; return; }
            newCtrs.push({
              id:'cr_'+Date.now()+'_'+idx, code:nextCode('CR',[...state.contracts,...newCtrs]),
              name, customerId:cust.id, bizType:String(r['벤더사']||'').trim(),
              stage:STAGES_CTR[0], request:'없음',
              contractDate:String(r['계약일']||todayStr()).trim(), amount:Number(r['계약금액'])||0, profitAmount:Number(r['이익금액'])||0,
              expiryDate:String(r['만료일']||'').trim(), alertDays:30,
              buyerContact:String(r['구매담당자']||'').trim(), buyerEmail:String(r['구매담당자이메일']||'').trim(),
              invoiceDate:String(r['계산서발행일자']||'').trim(),
              salesRep:String(r['영업담당']||state.user).trim(), remarks:String(r['비고']||'').trim(),
              opportunityId:null, regDate:todayStr()
            });
          });
          if(newCtrs.length===0){ alert('등록할 데이터를 찾지 못했습니다. 계약명·고객사명(등록된 고객사와 일치)을 확인해주세요.'); return; }
          const { error } = await sb.from('contracts').insert(newCtrs.map(ctrToRow));
          if(error){ alert('일괄등록 실패: '+error.message); return; }
          state.contracts.unshift(...newCtrs);
          showToast(newCtrs.length+'건 일괄등록되었습니다.'+(skipped>0?` (고객사 불일치로 ${skipped}건 제외)`:''));
          render();
        }catch(err){ alert('엑셀 파일을 읽는 중 오류가 발생했습니다.'); }
        finally{ excelInput.value=''; }
      };
      reader.readAsArrayBuffer(file);
    };
    document.querySelectorAll('.ctrNameToggle').forEach(el=>el.onclick=()=>{ state.ctrExpandedId = state.ctrExpandedId===el.dataset.id ? null : el.dataset.id; render(); });
    document.querySelectorAll('.editCtrBtn').forEach(b=>b.onclick=()=>openCtrModal(state.contracts.find(c=>c.id===b.dataset.id)));
    document.querySelectorAll('.copyCtrBtn').forEach(b=>b.onclick=()=>{
      const c = state.contracts.find(x=>x.id===b.dataset.id);
      askConfirm('이 계약을 영업기회관리에 "제안" 단계로 복사할까요?', ()=>copyContractToOpportunity(c), '확인', false);
    });
    document.querySelectorAll('.delCtrBtn').forEach(b=>b.onclick=()=>askConfirm('이 계약을 삭제할까요?', async ()=>{
      const { error } = await sb.from('contracts').delete().eq('id', b.dataset.id);
      if(error){ alert('삭제 실패: '+error.message); return; }
      state.contracts=state.contracts.filter(c=>c.id!==b.dataset.id); render();
    }));
    document.querySelectorAll('.ctrRowCheck').forEach(cb=>cb.onchange=e=>{
      if(e.target.checked) state.ctrSelected.add(cb.dataset.id); else state.ctrSelected.delete(cb.dataset.id);
      render();
    });
    const selAll=document.getElementById('ctrSelectAll'); if(selAll) selAll.onchange=e=>{
      document.querySelectorAll('.ctrRowCheck').forEach(cb=>{ if(e.target.checked) state.ctrSelected.add(cb.dataset.id); else state.ctrSelected.delete(cb.dataset.id); });
      render();
    };
    const mergeBtn=document.getElementById('ctrMergeBtn'); if(mergeBtn) mergeBtn.onclick=()=>{
      if(state.ctrSelected.size<2){ alert('합칠 계약을 2건 이상 체크해주세요.'); return; }
      const selectedContracts = state.contracts.filter(c=>state.ctrSelected.has(c.id));
      const firstCust = selectedContracts[0].customerId;
      if(selectedContracts.some(c=>c.customerId!==firstCust)){ alert('고객사가 서로 다른 계약은 합칠 수 없습니다. 같은 고객사의 계약만 선택해주세요.'); return; }
      state.mergePickerOpen=true; render();
    };
  }

  function bindMergePicker(){
    const bg=document.getElementById('mergePickBg'), close=document.getElementById('mergePickClose'), cancel=document.getElementById('mergePickCancel'), confirm=document.getElementById('mergePickConfirm');
    const closeFn=()=>{ state.mergePickerOpen=false; render(); };

  function mergeItemKey(it){ return (it.productId?'p:'+it.productId:'c:'+(it.customDetail||'')) + '|' + (it.vendor||''); }
  function combineItems(itemsArray){
    const map = new Map();
    itemsArray.forEach(it=>{
      const key = mergeItemKey(it);
      const qty = Number(it.qty)||0, price = Number(it.price)||0, amt = qty*price;
      if(map.has(key)){
        const ex = map.get(key);
        ex.qty += qty;
        ex._totalAmt += amt;
      } else {
        map.set(key, {...it, qty, _totalAmt:amt});
      }
    });
    const result=[];
    map.forEach(v=>{
      const qty = v.qty;
      v.price = qty>0 ? Math.round(v._totalAmt/qty) : v.price;
      delete v._totalAmt;
      result.push(v);
    });
    return result;
  }
  async function mergeContracts(targetId, otherIds){
    const target = state.contracts.find(c=>c.id===targetId);
    if(!target){ return; }
    const others = otherIds.map(id=>state.contracts.find(c=>c.id===id)).filter(Boolean);
    const diffCust = others.some(c=>c.customerId!==target.customerId);
    if(diffCust){ alert('고객사가 서로 다른 계약은 합칠 수 없습니다. 같은 고객사의 계약만 선택해주세요.'); return; }
    const targetOpp = target.opportunityId ? state.opportunities.find(o=>o.id===target.opportunityId) : null;
    if(!targetOpp){ alert('선택한 기준 계약에 연결된 영업기회가 없어 품목을 합칠 수 없습니다.'); return; }
    let addedAmount=0, addedProfit=0;
    let mergedItems = JSON.parse(JSON.stringify(targetOpp.items||[]));
    for(const id of otherIds){
      const c = state.contracts.find(x=>x.id===id);
      if(!c) continue;
      const opp = c.opportunityId ? state.opportunities.find(o=>o.id===c.opportunityId) : null;
      if(opp && opp.items && opp.items.length){
        mergedItems = [...mergedItems, ...JSON.parse(JSON.stringify(opp.items))];
      }
      addedAmount += Number(c.amount||0);
      addedProfit += Number(c.profitAmount||0);
    }
    targetOpp.items = mergedItems;
    targetOpp.expectedAmount = calcOppItemsTotal(targetOpp.items);
    const { error: e1 } = await sb.from('opportunities').update(oppToRow(targetOpp)).eq('id', targetOpp.id);
    if(e1){ alert('품목 합치기 실패: '+e1.message); return; }
    target.amount = Number(target.amount||0) + addedAmount;
    target.profitAmount = Number(target.profitAmount||0) + addedProfit;
    const { error: e2 } = await sb.from('contracts').update(ctrToRow(target)).eq('id', target.id);
    if(e2){ alert('계약 합치기 실패: '+e2.message); return; }
    for(const id of otherIds){
      const c = state.contracts.find(x=>x.id===id);
      if(c && c.opportunityId && c.opportunityId!==targetOpp.id){
        await sb.from('opportunities').delete().eq('id', c.opportunityId);
        state.opportunities = state.opportunities.filter(o=>o.id!==c.opportunityId);
      }
      await sb.from('contracts').delete().eq('id', id);
    }
    state.contracts = state.contracts.filter(c=>c.id===target.id || !otherIds.includes(c.id));
    const i = state.opportunities.findIndex(o=>o.id===targetOpp.id); if(i>-1) state.opportunities[i]=targetOpp;
    state.ctrSelected = new Set();
    state.mergePickerOpen = false;
    showToast(target.code+' 로 합쳐졌습니다.');
  }

  function renderStats(){
    const byPeriod={}; state.contracts.forEach(c=>{ const k=periodKey(c.contractDate,state.statsPeriod); byPeriod[k]=byPeriod[k]||{count:0,amount:0,profit:0}; byPeriod[k].count++; byPeriod[k].amount+=Number(c.amount||0); byPeriod[k].profit+=Number(c.profitAmount||0); });
    const periodRows = Object.entries(byPeriod).sort((a,b)=>a[0].localeCompare(b[0]));
    const maxPeriod = Math.max(1,...periodRows.map(r=>r[1].amount));
    const periodValues = periodRows.map(([k])=>k);
    if(state.statsPeriodValue!=='전체' && !periodValues.includes(state.statsPeriodValue)) state.statsPeriodValue='전체';

    const scopedContracts = state.statsPeriodValue==='전체' ? state.contracts : state.contracts.filter(c=>periodKey(c.contractDate,state.statsPeriod)===state.statsPeriodValue);

    const byRepAll={}; scopedContracts.forEach(c=>{ byRepAll[c.salesRep]=byRepAll[c.salesRep]||{count:0,amount:0,profit:0}; byRepAll[c.salesRep].count++; byRepAll[c.salesRep].amount+=Number(c.amount||0); byRepAll[c.salesRep].profit+=Number(c.profitAmount||0); });
    const repRows = Object.entries(byRepAll).sort((a,b)=>b[1].amount-a[1].amount);
    const maxRep = Math.max(1,...repRows.map(r=>r[1].amount));

    const byBizAll={};
    scopedContracts.forEach(c=>{
      const opp = c.opportunityId ? state.opportunities.find(o=>o.id===c.opportunityId) : null;
      const items = opp ? (opp.items||[]) : [];
      if(items.length>0){
        items.forEach(it=>{
          const v = (it.vendor||'').trim() || '(미지정)';
          const amt = (Number(it.qty)||0)*(Number(it.price)||0);
          const profit = Number(it.profit)||0;
          byBizAll[v]=byBizAll[v]||{count:0,amount:0,profit:0};
          byBizAll[v].count++; byBizAll[v].amount+=amt; byBizAll[v].profit+=profit;
        });
      } else {
        const vendors = String(c.bizType||'').split(',').map(s=>s.trim()).filter(Boolean);
        if(vendors.length===0) vendors.push('(미지정)');
        vendors.forEach(v=>{
          byBizAll[v]=byBizAll[v]||{count:0,amount:0,profit:0};
          byBizAll[v].count++; byBizAll[v].amount+=Number(c.amount||0); byBizAll[v].profit+=Number(c.profitAmount||0);
        });
      }
    });
    const bizRows = Object.entries(byBizAll).sort((a,b)=>b[1].amount-a[1].amount);
    const maxBiz = Math.max(1,...bizRows.map(r=>r[1].amount));

    const totalAmt = state.contracts.reduce((s,c)=>s+Number(c.amount||0),0);

          return displayedRows.length===0?'<div class="empty">데이터가 없습니다.</div>':displayedRows.map(([k,v])=>barGroup(k, v.amount, maxPeriod, v.profit, maxPeriod, v.count, '')).join(''); })()}

        ${bizRows.length===0?'<div class="empty">데이터가 없습니다.</div>':bizRows.map(([name,v])=>barGroup(name, v.amount, maxBiz, v.profit, maxBiz, v.count, 'blue')).join('')}
      </div>`;
  }
  function bindStats(){
    document.querySelectorAll('.periodBtn').forEach(b=>b.onclick=()=>{ state.statsPeriod=b.dataset.period; state.statsPeriodValue='전체'; render(); });
    const pv=document.getElementById('statsPeriodValue'); if(pv) pv.onchange=e=>{ state.statsPeriodValue=e.target.value; render(); };
  }

  // ================= GENERIC MODAL (customer / rep / contract / product) =================
  function renderModal(){
    const m = state.modal, d = m.data;
    return `<div class="modal-bg" id="genModalBg"><div class="modal">
      <div class="modal-head"><h3>${esc(m.title)}</h3><button class="modal-close" id="genModalClose">&times;</button></div>
      <div class="modal-body">
        ${m.infoLine?`<div class="hint" style="background:var(--header-fill); padding:8px 10px; border-radius:var(--radius); margin-bottom:14px;">${esc(m.infoLine)}</div>`:''}
        ${m.fields.map(f=>{
          const val = d[f.k];
          if(f.type==='select'){
            const opts = f.opts.map(o=>typeof o==='string'?{v:o,l:o}:o);
            return `<div class="field"><label>${f.label}</label><select data-k="${f.k}" ${f.disabled?'disabled':''}>
              ${f.k==='customerId'?`<option value="">선택 안함</option>`:''}
              ${opts.map(o=>`<option value="${esc(o.v)}" ${String(val)===String(o.v)?'selected':''}>${esc(o.l)}</option>`).join('')}
            </select>${f.disabled?'<p class="hint">일반 담당자는 본인 이름으로 고정됩니다.</p>':''}</div>`;
          }
          if(f.type==='textarea'){
            return `<div class="field"><label>${f.label}</label><textarea data-k="${f.k}" rows="3">${esc(val)}</textarea></div>`;
          }
          if(f.type==='remarkslog'){
            return `<div class="field"><label>${f.label}</label>
              <div id="genRemarksLog" style="border:1px solid var(--grid-strong); border-radius:var(--radius); padding:8px 10px; max-height:120px; overflow-y:auto; font-size:12.5px; margin-bottom:6px; background:#fbfbfa;"></div>
              <textarea id="genRemarksInput" class="omField" rows="1" placeholder="비고를 입력하고 Enter를 누르세요 (줄바꿈은 Shift+Enter)"></textarea>
            </div>`;
          }
          if(f.type==='checkbox'){
            return `<div class="field"><label>${f.label}</label>
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; border:1px solid var(--grid-strong); border-radius:var(--radius); padding:8px 9px; background:#fff;">
                <input type="checkbox" data-k="${f.k}" ${val?'checked':''} style="width:16px; height:16px; accent-color:var(--accent); flex-shrink:0;"/>
                <span style="font-size:12.5px; color:var(--ink-soft);">전체 데이터 조회/수정 가능</span>
              </label>
            </div>`;
          }
          return `<div class="field"><label>${f.label}</label><input data-k="${f.k}" type="${f.type}" value="${esc(val)}"/></div>`;
        }).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn-sm btn-ghost" id="genModalCancel">취소</button>
        <button class="btn-primary" style="width:auto; padding:8px 20px;" id="genModalSave">저장</button>
      </div>
    </div></div>`;
  }
  function bindModal(){
    const m = state.modal; if(!m) return;
    const bg=document.getElementById('genModalBg'), close=document.getElementById('genModalClose'), cancel=document.getElementById('genModalCancel'), save=document.getElementById('genModalSave');
    const closeFn=()=>{ state.modal=null; render(); };
    if(close) close.onclick=closeFn;
    if(cancel) cancel.onclick=closeFn;
    if(bg) bg.addEventListener('click', e=>{ if(e.target.id==='genModalBg') closeFn(); });
    document.querySelectorAll('[data-k]').forEach(el=>{
      if(el.type==='checkbox'){
        el.addEventListener('change', e=>{ m.data[e.target.dataset.k]=e.target.checked; });
      } else {
        el.addEventListener(el.tagName==='SELECT'?'change':'input', e=>{ m.data[e.target.dataset.k]=e.target.value; });
      }
    });
    const remarksLogField = m.fields.find(f=>f.type==='remarkslog');
    if(remarksLogField){
      const logEl=document.getElementById('genRemarksLog'), inputEl=document.getElementById('genRemarksInput');
      if(logEl && inputEl) bindRemarksLogField(m.data, remarksLogField.k, logEl, inputEl);
    }
    if(save) save.onclick=async ()=>{
      const d = m.data;
      const nameField = m.fields.find(f=>f.k==='name');
      if(nameField && !String(d.name||'').trim()){ alert('이름을 입력하세요.'); return; }
      m.fields.forEach(f=>{ if(f.type==='number') d[f.k]=Number(d[f.k])||0; });
      const TABLE_CFG = {
        customer:{table:'customers', field:'customers', toRow:custToRow},
        contract:{table:'contracts', field:'contracts', toRow:ctrToRow},
        product:{table:'products', field:'products', toRow:x=>x},
        rep:{table:'reps', field:'reps', toRow:x=>x},
        maintenance:{table:'maintenance_contracts', field:'maintenance', toRow:mtToRow},
      };
      const cfg = TABLE_CFG[m.type];
      const row = cfg.toRow(d);
      if(m.isNew){
        const { error } = await sb.from(cfg.table).insert(row);
        if(error){ alert('저장 실패: '+error.message); return; }
        state[cfg.field].unshift(d);
      } else {
        const { error } = await sb.from(cfg.table).update(row).eq('id', d.id);
        if(error){ alert('저장 실패: '+error.message); return; }
        const i=state[cfg.field].findIndex(x=>x.id===d.id); if(i>-1) state[cfg.field][i]=d;
      }
      state.modal=null;
      showToast('저장되었습니다.');
    };
  }

  // ================= SHELL BINDING =================
  function bindShell(){
    if(state.loading) return;
    document.querySelectorAll('.nav-item').forEach(el=>{ el.onclick=()=>{ state.tab=el.dataset.tab; state.filterText=''; state.oppStage='전체'; state.ctrStage='전체'; render(); }; });
    document.querySelectorAll('.sort-th').forEach(el=>{
      el.onclick=()=>{
        const table = el.dataset.table, col = el.dataset.col;
        const st = state.sortState[table] || (state.sortState[table]={key:null,dir:'asc'});
        if(st.key===col){ st.dir = st.dir==='asc'?'desc':'asc'; } else { st.key=col; st.dir='asc'; }
        render();
      };
    });
    document.querySelectorAll('.nav-group-label').forEach(el=>{ el.onclick=()=>{ const g=el.dataset.group; state.navOpenGroups[g] = state.navOpenGroups[g]===false; render(); }; });
    const logout=document.getElementById('logoutBtn'); if(logout) logout.onclick=async ()=>{ await sb.auth.signOut(); state.view='login'; state.user=null; render(); };
    const excelBtn=document.getElementById('excelExportBtn'); if(excelBtn) excelBtn.onclick=exportCurrentPage;
    if(state.tab==='dashboard') bindDashboard();
    if(state.tab==='customers') bindCustomers();
    if(state.tab==='reps') bindReps();
    if(state.tab==='opportunities') bindOpportunities();
    if(state.tab==='contracts') bindContracts();
    if(state.tab==='maintenance') bindMaintenance();
    if(state.tab==='products') bindProducts();
    if(state.tab==='stats') bindStats();
    bindModal();
    bindOppModal();
    bindOppPicker();
    bindMtPicker();
    bindMergePicker();
    bindConfirm();
  }

  async function init(){
    const { data } = await sb.auth.getSession();
    if(data && data.session){
      const u = data.session.user;
      state.user = (u.user_metadata && u.user_metadata.name) || u.email;
      state.userEmail = u.email;
      state.view='main';
      await loadAll();
    } else {
      render();
    }
  }
  init();
})();
</script>
</body>
</html>
